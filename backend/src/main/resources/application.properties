spring.application.name=lms-backend

# ---- Database (PostgreSQL; manage it with pgAdmin) ----
# Local default is lms_db. On Render set DATABASE_URL (jdbc form), DATABASE_USERNAME, DATABASE_PASSWORD.
# The older DB_URL / DB_USER / DB_PASSWORD names (used by docker-compose) still work.
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/lms_db}}
spring.datasource.username=${DATABASE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:postgres}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
server.port=${PORT:8080}
server.error.include-message=always

# ---- JWT (secret must be 32+ chars) ----
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ---- CORS / frontend URL (comma-separate several origins, e.g. localhost + your Vercel URL) ----
app.cors-origin=${FRONTEND_URL:http://localhost:5173}
# Used for links/redirects; the first origin in FRONTEND_URL
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ---- Payments: Razorpay (use rzp_test_ keys while developing) ----
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.currency=${RAZORPAY_CURRENCY:INR}

# ---- E-mail (Gmail SMTP with an App Password; leave MAIL_USERNAME empty to see the EMAIL job FAIL) ----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
lms.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# ---- Background jobs ----
lms.invoice.dir=${INVOICE_DIR:invoices}

# ---- Health endpoint for deployment platforms ----
management.endpoints.web.exposure.include=health
management.health.mail.enabled=false
